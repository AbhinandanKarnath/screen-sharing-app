<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetClone Meeting Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', Arial, sans-serif;
            background-color: #202124;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .meeting-container {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            position: relative;
            overflow: auto;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            align-items: center;
            justify-items: center;
            width: 100%;
            height: 100vh; /* Ensures the grid takes full viewport height */
            flex: 1;

        }

        .video-wrapper {
        width: auto;
        height: auto;
        background-color: #3c4043;
        border-radius: 0;
        overflow: hidden;
        position: relative;
}


        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            background: rgba(32, 33, 36, 0.9);
            z-index: 100;
        }

        .control-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background-color: #3c4043;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 20px;
        }

        .control-button:hover {
            background-color: #5f6368;
        }

        .control-button.active {
            background-color: #ea4335;
        }

        .control-button.end-call {
            background-color: #ea4335;
        }

        .control-button.end-call:hover {
            background-color: #dc2626;
        }

        .participant-name {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        #room-info {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(60, 64, 67, 0.9);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 100;
        }

        .room-link {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(60, 64, 67, 0.9);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 100;
            cursor: pointer;
        }
        
        .room-link:hover {
            background: rgba(80, 84, 87, 0.9);
        }
    </style>
</head>
<body>
    <div id="room-info"></div>
    <div class="room-link" onclick="copyRoomLink()">Copy Meeting Link</div>
    
    <div class="meeting-container">
        <div class="video-grid">
            <div class="video-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="participant-name">You</div>
            </div>
            <!-- Remote videos will be added here dynamically -->
        </div>
    </div>

    <div class="controls">
        <button class="control-button" id="toggleMic" title="Toggle microphone">
            <i class="fas fa-microphone"></i>
        </button>
        <button class="control-button" id="toggleVideo" title="Toggle video">
            <i class="fas fa-video"></i>
        </button>
        <button class="control-button" id="toggleScreen" title="Share screen">
            <i class="fas fa-desktop"></i>
        </button>
        <button class="control-button end-call" id="endCall" title="End call">
            <i class="fas fa-phone-slash"></i>
        </button>
    </div>

    <script>
        function copyRoomLink() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('Meeting link copied to clipboard!');
            }).catch(err => {
                console.error('Could not copy text: ', err);
            });
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
